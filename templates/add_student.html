{% extends 'base.html' %}

{% block content %}
<section class="page-section">
    <div class="page-header">
        <div>
            <p class="section-label">Students</p>
            <h3 class="section-heading">Add a new student</h3>
        </div>
    </div>

    <div class="form-panel">
        <form class="needs-validation" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="student-name">Student name</label>
                    <input type="text" class="form-control" id="student-name" placeholder="Enter full name" required>
                    <div class="invalid-feedback">Please enter a student name.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="year-level">Year level</label>
                    <select class="form-select" id="year-level" required>
                        <option value="">Select year level</option>
                        <option>Year 1</option>
                        <option>Year 2</option>
                        <option>Year 3</option>
                        <option>Year 4</option>
                        <option>Year 5+</option>
                    </select>
                    <div class="invalid-feedback">Please choose a year level.</div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="family-contact">Family contact</label>
                    <input type="text" class="form-control" id="family-contact" placeholder="Parent or family contact details" required>
                    <div class="invalid-feedback">Please provide a contact name and number.</div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="notes">Notes</label>
                    <textarea class="form-control" id="notes" rows="4" placeholder="Optional support notes or referral details"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('students') }}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save student</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
