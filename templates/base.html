<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title or 'Redgum Tutoring' }} | Redgum Tutoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand-block">
                <div class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></div>
                <div>
                    <h1>Redgum</h1>
                    <p>Tutoring</p>
                </div>
            </div>

            <nav class="nav-menu" aria-label="Main navigation">
                <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>Dashboard</span>
                </a>
                <a href="{{ url_for('students') }}" class="nav-link {% if request.endpoint == 'students' %}active{% endif %}">
                    <i class="fa-solid fa-user-graduate"></i>
                    <span>Students</span>
                </a>
                <a href="{{ url_for('tutors') }}" class="nav-link {% if request.endpoint == 'tutors' %}active{% endif %}">
                    <i class="fa-solid fa-chalkboard-user"></i>
                    <span>Tutors</span>
                </a>
                <a href="{{ url_for('availability') }}" class="nav-link {% if request.endpoint == 'availability' %}active{% endif %}">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Availability</span>
                </a>
                <a href="{{ url_for('sessions') }}" class="nav-link {% if request.endpoint == 'sessions' %}active{% endif %}">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <span>Sessions</span>
                </a>
                <a href="{{ url_for('schedule') }}" class="nav-link {% if request.endpoint == 'schedule' %}active{% endif %}">
                    <i class="fa-solid fa-table-columns"></i>
                    <span>Schedule</span>
                </a>
                <a href="{{ url_for('reports') }}" class="nav-link {% if request.endpoint == 'reports' %}active{% endif %}">
                    <i class="fa-solid fa-chart-column"></i>
                    <span>Reports / History</span>
                </a>
            </nav>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-toggle" aria-label="Toggle menu">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div>
                        <p class="eyebrow">Administration</p>
                        <h2>{{ page_title }}</h2>
                    </div>
                </div>

                <div class="topbar-actions">
                    <button class="btn btn-light btn-sm border-0">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                    <div class="user-pill">
                        <div class="avatar">AR</div>
                        <div>
                            <strong>Admin</strong>
                            <small>Operations</small>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content-area">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
